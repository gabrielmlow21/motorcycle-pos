# Checks formatting and runs the Laravel API tests on every PR and push to
# main that touches api/. Nothing is deployed: hosting waits until the shop is
# close to real use (DESIGN.md, decision 5). The deploy job is kept on the
# chore/phase-0-deploy-pipeline branch for when that day comes.
#
# Path filters mean a frontend-only change never runs this.
name: API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  test:
    runs-on: ubuntu-latest

    # Tests run against real MySQL, same as local (see the comment in phpunit.xml).
    # These credentials are throwaway CI-only values matching .env.example.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local_dev_only
          MYSQL_DATABASE: pos_test
          MYSQL_USER: posadmin
          MYSQL_PASSWORD: local_dev_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal_dev_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test
